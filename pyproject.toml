[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exo"
version = "0.0.1"
description = "Distributed inference engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.10.11",
    "aiohttp_cors==0.7.0",
    "aiofiles==24.1.0",
    "grpcio==1.70.0",
    "grpcio-tools==1.70.0",
    "Jinja2==3.1.4",
    "numpy==2.0.0",
    "nuitka==2.5.1",
    "nvidia-ml-py==12.560.30",
    "opencv-python==4.10.0.84",
    "pillow==10.4.0",
    "prometheus-client==0.20.0",
    "protobuf==5.28.1",
    "psutil==6.0.0",
    "pyamdgpuinfo==2.1.6; sys_platform == 'linux'",
    "pydantic==2.9.2",
    "requests==2.32.3",
    "rich==13.7.1",
    "scapy==2.6.1",
    "tqdm==4.66.4",
    "transformers==4.46.3",
    "uuid==1.30",
    "uvloop==0.21.0",
    "tinygrad @ git+https://github.com/tinygrad/tinygrad.git@ec120ce6b9ce8e4ff4b5692566a683ef240e8bc8",
    # Platform-specific dependencies
    "mlx==0.27.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm==0.26.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pywin32==308; sys_platform == 'win32'",
    "torch>=2.7.1",
    "llguidance>=1.1.1",
]

[project.optional-dependencies]
formatting = [
    "yapf==0.40.2",
]
apple-silicon = [
    "mlx==0.27.1",
    "mlx-lm==0.26.2",
]
windows = [
    "pywin32==308",
]
nvidia-gpu = [
    "nvidia-ml-py==12.560.30",
]
amd-gpu = [
    "pyrsmi==0.2.0",
]
# Convenience extras for common combinations
all-gpu = [
    "nvidia-ml-py==12.560.30",
    "pyrsmi==0.2.0",
]
dev = [
    "yapf==0.40.2",
]

[project.scripts]
exo = "exo.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["exo*"]

[tool.setuptools.package-data]
exo = ["tinychat/**/*"]

# uv-specific configuration
[tool.uv]
dev-dependencies = [
    "yapf==0.40.2",
]

# Optional: Configure uv to handle git dependencies
[tool.uv.sources]
tinygrad = { git = "https://github.com/tinygrad/tinygrad.git", rev = "ec120ce6b9ce8e4ff4b5692566a683ef240e8bc8" }
